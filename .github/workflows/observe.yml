name: Record observation history
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: observation-history
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Measure without posting or exporting raw records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: python scripts/record_observation.py
      - name: Preserve measured history in main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HISTORY.md docs/history/
          git diff --cached --quiet && exit 0
          git commit -m 'docs: record measured observation snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
