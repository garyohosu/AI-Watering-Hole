name: Deploy to Cloudflare

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test && npx wrangler deploy --dry-run
      - name: Validate Cloudflare credentials and D1 ID
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "Missing D1_DATABASE_ID environment variable"; exit 1; }
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "Invalid D1_DATABASE_ID"; exit 1; }
      - name: Create deployment-only Wrangler configuration
        run: |
          node -e 'const fs=require("fs");const s=fs.readFileSync("wrangler.jsonc","utf8");fs.writeFileSync("wrangler.deploy.jsonc",s.replace("REPLACE_WITH_D1_DATABASE_ID",process.env.D1_DATABASE_ID))'
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply ai-watering-hole --remote --config wrangler.deploy.jsonc
      - name: Check production post count before deployment
        run: |
          npx wrangler d1 execute ai-watering-hole --remote --config wrangler.deploy.jsonc --command "SELECT COUNT(*) AS count FROM posts"
      - name: Deploy Worker with committed posting configuration
        run: npx wrangler deploy --config wrangler.deploy.jsonc
      - name: Deployment reminder
        run: echo "Verify public URL and record posting state and observation baseline."
